name: Public MCP release verification
on:
  workflow_dispatch:
  schedule:
    - cron: '21 3 * * *'
permissions:
  contents: read
jobs:
  production:
    name: Live MCP, content, Apps and Skills
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify the live Legal Fournier service
        run: python3 -u scripts/smoke-readonly.py --base https://legalfournier.com --public-metadata
  registry:
    name: Official MCP Registry listing
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify the declared release in the official Registry
        run: python3 -u scripts/smoke-readonly.py --registry-only
