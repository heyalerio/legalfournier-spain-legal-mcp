name: Public MCP release verification
on:
  workflow_dispatch:
  schedule:
    - cron: '21 3 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check both protocols, content, Apps, Skills and registry version
        run: python3 scripts/smoke-readonly.py --base https://legalfournier.com --public-metadata --registry
